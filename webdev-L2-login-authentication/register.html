<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureAccess | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">

            <div class="auth-header">
                <p class="auth-label">SecureAccess</p>
                <h1>Create Account</h1>
                <p>Register to create your secure personal account.</p>
            </div>

            <form id="registerForm" class="auth-form">

                <div class="form-group">
                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Choose a username"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 8 characters, including a number"
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                    >
                </div>

                <p
                    id="registerError"
                    class="form-error"
                    role="alert"
                ></p>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Register
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="index.html">Login</a>
            </p>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
