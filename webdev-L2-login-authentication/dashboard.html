<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureAccess | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="dashboard-container">

        <section class="dashboard-card">

            <div class="dashboard-header">

                <div>
                    <p class="auth-label">SecureAccess</p>

                    <h1>
                        Welcome,
                        <span id="dashboardUsername">
                            User
                        </span>
                    </h1>
                </div>

                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button"
                >
                    Logout
                </button>

            </div>

            <div class="dashboard-content">

                <div class="dashboard-icon">
                    ✦
                </div>

                <h2>Your Dashboard</h2>

                <p>
                    You have successfully logged in to your secure
                    account. This protected page is only available
                    during an active session.
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
