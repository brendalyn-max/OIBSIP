<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Daily Tasks | To-Do App</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<main class="todo-app">

    <header class="todo-header">
        <p class="header-label">Daily Planner</p>

        <h1>My To-Do List</h1>

        <p class="header-description">
            Organize your day, stay focused, and keep track of what matters.
        </p>
    </header>

    <section class="task-input-section">

        <form id="taskForm" class="task-form">

            <label for="taskInput" class="visually-hidden">
                Enter a new task
            </label>

            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
                autocomplete="off"
            >

            <button type="submit" id="addTaskButton">
                Add Task
            </button>

        </form>

        <p id="taskError" class="task-error"></p>

    </section>

    <section class="task-section">

        <div class="section-heading">
            <div>
                <h2>Pending Tasks</h2>
                <p id="pendingCount">0 pending</p>
            </div>
        </div>

        <div id="pendingTasks" class="task-list">

            <p id="pendingEmptyState" class="empty-state">
                No pending tasks. You're all caught up!
            </p>

        </div>

    </section>

    <section class="task-section">

        <div class="section-heading">
            <div>
                <h2>Completed Tasks</h2>
                <p id="completedCount">0 completed</p>
            </div>
        </div>

        <div id="completedTasks" class="task-list">

            <p id="completedEmptyState" class="empty-state">
                No completed tasks yet.
            </p>

        </div>

    </section>

</main>

<script src="script.js"></script>


</body>

</html>
