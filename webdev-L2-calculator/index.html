<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator-container">
        <div class="calculator">
            <input type="text" class="calculator-display" id="calculatorDisplay" value="0" readonly>

            <div class="calculator-buttons">
                <button class="calculator-button calculator-button-clear" id="clearButton">C</button>
                <button class="calculator-button calculator-button-operator" id="divideButton">÷</button>
                <button class="calculator-button calculator-button-operator" id="multiplyButton">×</button>
                <button class="calculator-button calculator-button-operator" id="subtractButton">−</button>

                <button class="calculator-button" id="sevenButton">7</button>
                <button class="calculator-button" id="eightButton">8</button>
                <button class="calculator-button" id="nineButton">9</button>
                <button class="calculator-button calculator-button-operator" id="addButton">+</button>

                <button class="calculator-button" id="fourButton">4</button>
                <button class="calculator-button" id="fiveButton">5</button>
                <button class="calculator-button" id="sixButton">6</button>
                <button class="calculator-button calculator-button-equals" id="equalsButton">=</button>

                <button class="calculator-button" id="oneButton">1</button>
                <button class="calculator-button" id="twoButton">2</button>
                <button class="calculator-button" id="threeButton">3</button>

                <button class="calculator-button calculator-button-zero" id="zeroButton">0</button>
                <button class="calculator-button" id="decimalButton">.</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
